spring:
  application:
    name: event-invite-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/eventinvite}
    username: ${SPRING_DATASOURCE_USERNAME:eventinvite}
    password: ${SPRING_DATASOURCE_PASSWORD:eventinvite2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 30000   # 30s TTL for event page cache

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:eventinvite}
  secret-key: ${MINIO_SECRET_KEY:EventInvite2024!}
  bucket: ${MINIO_BUCKET:event-media}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretJwtKeyThatIsAtLeast256BitsLong_ChangeInProduction!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8091}

smtp:
  enabled: ${SMTP_ENABLED:false}
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  from: ${SMTP_FROM:noreply@eventinvite.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /**
