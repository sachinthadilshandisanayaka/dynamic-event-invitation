services:
  postgres:
    image: postgres:15-alpine
    container_name: dev-eventinvite-postgres
    environment:
      POSTGRES_DB: eventinvite
      POSTGRES_USER: eventinvite
      POSTGRES_PASSWORD: eventinvite2024
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dev-eventinvite-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dev-eventinvite-minio
    environment:
      MINIO_ROOT_USER: eventinvite
      MINIO_ROOT_PASSWORD: EventInvite2024!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data
    command: server /data --console-address ':9001'
    restart: unless-stopped

volumes:
  dev_postgres_data:
  dev_minio_data:
